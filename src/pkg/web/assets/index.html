<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>drop</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#4c1d95">

<!-- The interface is Go, compiled to WebAssembly, and the same code the phone runs. This page is the
     loader: everything a person sees is drawn onto the canvas Gio takes over. -->
<style>
  html, body { margin: 0; height: 100%; background: #faf9fb; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #121016; } }

  #loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    font: 15px/1.5 system-ui, sans-serif;
    color: #6b6376;
    text-align: center;
    padding: 24px;
  }

  #loading b { display: block; color: #4c1d95; font-size: 17px; margin-bottom: 6px; }
  @media (prefers-color-scheme: dark) {
    #loading { color: #8f8799; }
    #loading b { color: #a583e8; }
  }
</style>

<div id="loading"><b>drop</b><span id="said">loading…</span></div>

<script src="/wasm_exec.js"></script>
<script>
  const said = document.querySelector("#said");

  // Streamed rather than fetched whole: the interface is a few megabytes, and compiling it while it
  // arrives is the difference between a pause and a wait.
  async function start() {
    const go = new Go();

    try {
      const source = WebAssembly.instantiateStreaming
        ? WebAssembly.instantiateStreaming(fetch("/drop.wasm"), go.importObject)
        : fetch("/drop.wasm").then((r) => r.arrayBuffer()).then((b) => WebAssembly.instantiate(b, go.importObject));

      const built = await source;
      document.querySelector("#loading").remove();
      go.run(built.instance);
    } catch (err) {
      said.textContent = "could not start: " + err.message;
    }
  }

  start();
</script>
