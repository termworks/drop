name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release. Leave empty to build and check only.'
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag || 'check' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event.inputs.tag == '' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="$(sed -n 's/.*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/main.go)"
          test -n "${version}"
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "release tag ${RELEASE_TAG} does not match version v${version}" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1

      - name: Format
        run: test -z "$(gofmt -l -s src)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

      - name: End-to-end test
        env:
          CGO_ENABLED: '0'
        run: go test -tags=e2e -count=1 -timeout=15m ./src/e2e/

  # The binary is pure Go with cgo off, so both targets cross-compile from one runner and the
  # result is static. No musl, no container, no QEMU — which is the whole reason the build
  # stayed cgo-free in the first place.
  binaries:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="$(grep -oP 'version\s*=\s*"\K[^"]+' src/main.go)"
          commit="$(git rev-parse --short HEAD)"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          name="drop-${{ matrix.goos }}-${{ matrix.goarch }}"

          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${stamp} -X main.builtBy=ci" \
            -o "${name}" ./src

          if readelf -l "${name}" | grep -q 'INTERP'; then
            echo "${name} has a program interpreter" >&2
            exit 1
          fi
          if readelf -d "${name}" 2>&1 | grep -q '(NEEDED)'; then
            echo "${name} has dynamic dependencies" >&2
            exit 1
          fi
          sha256sum "${name}" > "${name}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: drop-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            drop-${{ matrix.goos }}-${{ matrix.goarch }}
            drop-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  release:
    needs: [binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Only a tag makes a release. A manual run builds everything and leaves the artifacts, which is
    # how you check a change without publishing it.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            drop-*
