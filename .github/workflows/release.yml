name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release. Leave empty to build and check only.'
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag || 'check' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event.inputs.tag == '' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="$(sed -n 's/.*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/main.go)"
          test -n "${version}"
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "release tag ${RELEASE_TAG} does not match version v${version}" >&2
            exit 1
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.13.1

      - name: Format
        run: test -z "$(gofmt -l -s src apps)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        env:
          CGO_ENABLED: '1'
        run: go test -race -shuffle=on ./...

      - name: Fuzz wire decoders
        run: |
          set -euo pipefail
          grep -R '^func Fuzz' -n src --include='*_test.go' |
            while IFS=: read -r file _ declaration; do
              name="${declaration#func }"
              name="${name%%(*}"
              package="./$(dirname "${file}")"
              echo "fuzzing ${package} ${name}"
              go test "${package}" -run '^$' -fuzz "^${name}$" -fuzztime=3s
            done

      - name: End-to-end test
        env:
          CGO_ENABLED: '0'
        run: go test -tags=e2e -count=1 -timeout=15m ./src/e2e/


  # The Android app: the Go core as an AAR through gomobile, then the Kotlin shell around it. Built
  # in the flake's android shell so the SDK, NDK and gomobile are the pinned ones.
  android:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        continue-on-error: true
        with:
          name: nix-community

      # The same flags as `make aar`; the runner has no oslo to run that recipe.
      - name: Bind the Go core
        run: |
          mkdir -p apps/android/libs
          nix develop .#android --command bash -c 'gomobile init && gomobile bind -target android/arm64,android/arm,android/amd64 -androidapi 26 -trimpath -ldflags "-s -w" -o apps/android/libs/mobile.aar ./apps/android/mobile'
        env:
          CGO_ENABLED: '1'
          GOFLAGS: -buildvcs=false

      - name: Build the APK
        run: nix develop .#android --command bash -c 'gradle --project-dir apps/android --no-daemon -PdropVersion="$(sed -n "s/.*version[[:space:]]*=[[:space:]]*\"\([^\"]*\)\".*/\1/p" src/main.go)" assembleRelease'

      - name: Name it
        id: apk
        run: |
          set -euo pipefail
          built="apps/android/app/build/outputs/apk/release/app-release.apk"
          test -f "${built}"
          version="$(sed -n 's/.*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/main.go)"
          name="drop-${version}-android.apk"
          mv "${built}" "${name}"
          sha256sum "${name}" > "${name}.sha256"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drop-android
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          if-no-files-found: error

  # The binary is pure Go with cgo off, so both targets cross-compile from one runner and the
  # result is static. No musl, no container, no QEMU — which is the whole reason the build
  # stayed cgo-free in the first place.
  binaries:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="$(grep -oP 'version\s*=\s*"\K[^"]+' src/main.go)"
          commit="$(git rev-parse --short HEAD)"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          name="drop-${{ matrix.goos }}-${{ matrix.goarch }}"

          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${stamp} -X main.builtBy=ci" \
            -o "${name}" ./src

          if readelf -l "${name}" | grep -q 'INTERP'; then
            echo "${name} has a program interpreter" >&2
            exit 1
          fi
          if readelf -d "${name}" 2>&1 | grep -q '(NEEDED)'; then
            echo "${name} has dynamic dependencies" >&2
            exit 1
          fi
          sha256sum "${name}" > "${name}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drop-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            drop-${{ matrix.goos }}-${{ matrix.goarch }}
            drop-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  release:
    needs: [binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Only a tag makes a release. A manual run builds everything and leaves the artifacts, which is
    # how you check a change without publishing it.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            drop-*
