name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release. Leave empty to build and check only.'
        required: false

permissions:
  contents: write

jobs:
  # The binary is pure Go with cgo off, so both targets cross-compile from one runner and the
  # result is static. No musl, no container, no QEMU — which is the whole reason the build
  # stayed cgo-free in the first place.
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="$(grep -oP 'version\s*=\s*"\K[^"]+' src/main.go)"
          commit="$(git rev-parse --short HEAD)"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          name="drop-${{ matrix.goos }}-${{ matrix.goarch }}"

          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${stamp} -X main.builtBy=ci" \
            -o "${name}" ./src

          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl
          upx -9 -q "${name}"
          sha256sum "${name}" > "${name}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: drop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            drop-${{ matrix.goos }}-${{ matrix.goarch }}
            drop-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  # The phone app is a share client, not a node: it holds no identity and pairs with nothing. It
  # asks a machine running `drop web` to send on its behalf.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build
        working-directory: android
        run: |
          set -eu
          gradle wrapper --gradle-version 8.11.1
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk ../drop.apk

      - name: Checksum
        run: sha256sum drop.apk > drop.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: drop-apk
          path: |
            drop.apk
            drop.apk.sha256

  release:
    needs: [binaries, apk]
    runs-on: ubuntu-latest
    # Only a tag makes a release. A manual run builds everything and leaves the artifacts, which is
    # how you check a change without publishing it.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            drop-*
            drop.apk
            drop.apk.sha256
